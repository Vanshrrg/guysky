<!DOCTYPE html>
<html>
<head><title>Generate Disease Cubes</title></head>
<body>
<h2>Generating cubes... check your Downloads folder.</h2>
<canvas id="c" width="102" height="88"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Isometric cube coordinates for 102x88 canvas
// Top face (diamond), left face, right face
const T  = { x: 51, y:  6 };  // top point
const R  = { x: 92, y: 28 };  // right point
const B  = { x: 51, y: 50 };  // bottom point (top face) = top of side faces
const L  = { x: 10, y: 28 };  // left point
const BL = { x: 10, y: 56 };  // bottom-left
const BR = { x: 92, y: 56 };  // bottom-right
const BOT= { x: 51, y: 78 };  // bottom center

function drawCube(topColor, leftColor, rightColor) {
  ctx.clearRect(0, 0, 102, 88);

  // Top face
  ctx.beginPath();
  ctx.moveTo(T.x,  T.y);
  ctx.lineTo(R.x,  R.y);
  ctx.lineTo(B.x,  B.y);
  ctx.lineTo(L.x,  L.y);
  ctx.closePath();
  ctx.fillStyle = topColor;
  ctx.fill();

  // Left face
  ctx.beginPath();
  ctx.moveTo(L.x,  L.y);
  ctx.lineTo(B.x,  B.y);
  ctx.lineTo(BOT.x, BOT.y);
  ctx.lineTo(BL.x, BL.y);
  ctx.closePath();
  ctx.fillStyle = leftColor;
  ctx.fill();

  // Right face
  ctx.beginPath();
  ctx.moveTo(B.x,  B.y);
  ctx.lineTo(R.x,  R.y);
  ctx.lineTo(BR.x, BR.y);
  ctx.lineTo(BOT.x, BOT.y);
  ctx.closePath();
  ctx.fillStyle = rightColor;
  ctx.fill();
}

function download(filename) {
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

const cubes = [
  { name: 'cube-red.png',    top: '#CC2222', left: '#991111', right: '#6B0000' },
  { name: 'cube-yellow.png', top: '#E8C800', left: '#C4A800', right: '#907800' },
  { name: 'cube-black.png',  top: '#4A4A4A', left: '#2E2E2E', right: '#1A1A1A' },
  { name: 'cube-blue.png',   top: '#2277DD', left: '#1155BB', right: '#003D99' },
];

let i = 0;
function next() {
  if (i >= cubes.length) return;
  const c = cubes[i++];
  drawCube(c.top, c.left, c.right);
  download(c.name);
  setTimeout(next, 800);
}

// Start after a short delay
setTimeout(next, 500);
</script>
</body>
</html>
