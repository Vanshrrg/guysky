<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Board Full Overlay Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; display: flex; flex-direction: column; align-items: center; padding: 20px; font-family: system-ui, sans-serif; }
    h1 { color: #888; font-size: 12px; margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #aaa; }
    .legend-swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
    .board-wrap { position: relative; width: 100%; max-width: 1300px; aspect-ratio: 918 / 568; }
    .board-wrap > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
    svg.overlay { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  </style>
</head>
<body>
  <h1>Old coordinates → new board</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:#ffffff55;border:1px solid #fff"></div> City connection</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#3da5e044;border:1px solid #3da5e0"></div> City dot</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#ffdd0044;border:1px dashed #ffdd00"></div> Objective slot</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#4488ff44;border:1px solid #4488ff"></div> Outbreak track</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#44ff8844;border:1px solid #44ff88"></div> Infection rate</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#ffffff22;border:1px solid #ccc"></div> Card pile</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#ff880044;border:1px solid #ff8800"></div> Cure marker start/cured</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#ff00ff44;border:1px solid #ff66ff"></div> Player token</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#88888844;border:1px solid #888"></div> Cube tray</div>
  </div>
  <div class="board-wrap">
    <img src="object/newupdatedboard.png" alt="board" draggable="false">
    <svg class="overlay" viewBox="0 0 100 100" preserveAspectRatio="none" id="svg"></svg>
  </div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');
// Board is 918px wide × 568px tall (landscape).
// In a preserveAspectRatio="none" SVG with viewBox 0 0 100 100:
//   1 SVG-x-unit = board_width / 100 px
//   1 SVG-y-unit = board_height / 100 px
// So a square in pixels = w SVG-x-units wide and w * (918/568) SVG-y-units tall.
const AR = 918 / 568; // ≈ 1.617

// ─── Helpers ─────────────────────────────────────────────────────────────────
function el(tag, attrs, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e);
  return e;
}

function line(x1, y1, x2, y2, stroke, opacity, width, dash) {
  const e = el('line', { x1, y1, x2, y2, stroke, 'stroke-opacity': opacity, 'stroke-width': width, 'stroke-linecap': 'round', 'vector-effect': 'non-scaling-stroke' });
  if (dash) e.setAttribute('stroke-dasharray', dash);
}

// Centered rectangle. w = % board-width; aspect = pixel h/w ratio of the element.
function rect(cx, cy, w, aspect, stroke, fill, dash, opacity = 1) {
  const rw = w;
  const rh = w * aspect * AR; // convert to SVG y-units
  el('rect', {
    x: cx - rw / 2, y: cy - rh / 2, width: rw, height: rh,
    stroke, 'stroke-width': '0.4', fill, 'fill-opacity': '0.15',
    'stroke-opacity': opacity, 'vector-effect': 'non-scaling-stroke',
    ...(dash ? { 'stroke-dasharray': dash } : {}),
  });
}

// Circle. r = % board-width; draws as ellipse to appear circular on the landscape board.
function circle(cx, cy, r, stroke, fill, opacity = 1, sw = '0.5') {
  el('ellipse', {
    cx, cy, rx: r, ry: r * AR, // ry scaled so it looks circular in pixels
    stroke, 'stroke-width': sw, fill, 'fill-opacity': '0.35',
    'stroke-opacity': opacity, 'vector-effect': 'non-scaling-stroke',
  });
}

function text(cx, cy, str, color, size = '1.8') {
  const t = el('text', {
    x: cx, y: cy, fill: color, 'font-size': size,
    'text-anchor': 'middle', 'dominant-baseline': 'middle',
    'font-family': 'system-ui, sans-serif', 'font-weight': 'bold',
    'vector-effect': 'non-scaling-stroke',
    style: 'paint-order: stroke; stroke: #000; stroke-width: 1.5px; stroke-linecap: round;',
  });
  t.textContent = str;
}

// ─── Data ────────────────────────────────────────────────────────────────────

const COLOR_HEX = { blue: '#3da5e0', yellow: '#f2c83d', black: '#9aaabb', red: '#e0533d' };

const CITIES = [
  { id: "san-francisco",    name: "San Francisco",    color: "blue",   pos: { x: 15.9, y: 38.8 }, neighbors: ["chicago","los-angeles","tokyo","manila"] },
  { id: "chicago",          name: "Chicago",          color: "blue",   pos: { x: 24,   y: 34.7 }, neighbors: ["san-francisco","los-angeles","mexico-city","atlanta","montreal"] },
  { id: "montreal",         name: "Montreal",         color: "blue",   pos: { x: 30.4, y: 34.7 }, neighbors: ["chicago","new-york","washington"] },
  { id: "new-york",         name: "New York",         color: "blue",   pos: { x: 35.3, y: 35.7 }, neighbors: ["montreal","washington","london","madrid"] },
  { id: "washington",       name: "Washington",       color: "blue",   pos: { x: 34.2, y: 41.8 }, neighbors: ["atlanta","montreal","new-york","miami"] },
  { id: "atlanta",          name: "Atlanta",          color: "blue",   pos: { x: 26.5, y: 42.4 }, neighbors: ["chicago","washington","miami"] },
  { id: "london",           name: "London",           color: "blue",   pos: { x: 47.2, y: 29.6 }, neighbors: ["new-york","madrid","paris","essen"] },
  { id: "madrid",           name: "Madrid",           color: "blue",   pos: { x: 46.3, y: 39.6 }, neighbors: ["new-york","london","paris","sao-paulo","algiers"] },
  { id: "paris",            name: "Paris",            color: "blue",   pos: { x: 52,   y: 34.9 }, neighbors: ["london","madrid","essen","milan","algiers"] },
  { id: "essen",            name: "Essen",            color: "blue",   pos: { x: 53.6, y: 27.8 }, neighbors: ["london","paris","milan","st-petersburg"] },
  { id: "milan",            name: "Milan",            color: "blue",   pos: { x: 56.2, y: 32.8 }, neighbors: ["essen","paris","istanbul"] },
  { id: "st-petersburg",    name: "St. Petersburg",   color: "blue",   pos: { x: 60.8, y: 25.8 }, neighbors: ["essen","istanbul","moscow"] },
  { id: "los-angeles",      name: "Los Angeles",      color: "yellow", pos: { x: 17.2, y: 49   }, neighbors: ["san-francisco","chicago","mexico-city","sydney","lima"] },
  { id: "mexico-city",      name: "Mexico City",      color: "yellow", pos: { x: 23.1, y: 52.4 }, neighbors: ["los-angeles","chicago","miami","bogota","lima"] },
  { id: "miami",            name: "Miami",            color: "yellow", pos: { x: 29.8, y: 48.7 }, neighbors: ["atlanta","washington","mexico-city","bogota"] },
  { id: "bogota",           name: "Bogotá",           color: "yellow", pos: { x: 29.9, y: 61   }, neighbors: ["mexico-city","miami","lima","buenos-aires","sao-paulo"] },
  { id: "lima",             name: "Lima",             color: "yellow", pos: { x: 27.6, y: 72.4 }, neighbors: ["mexico-city","bogota","santiago","los-angeles"] },
  { id: "santiago",         name: "Santiago",         color: "yellow", pos: { x: 28.4, y: 83.7 }, neighbors: ["lima","buenos-aires"] },
  { id: "buenos-aires",     name: "Buenos Aires",     color: "yellow", pos: { x: 35.3, y: 82   }, neighbors: ["bogota","sao-paulo","santiago","johannesburg"] },
  { id: "sao-paulo",        name: "São Paulo",        color: "yellow", pos: { x: 39,   y: 73.8 }, neighbors: ["bogota","buenos-aires","madrid","lagos"] },
  { id: "lagos",            name: "Lagos",            color: "yellow", pos: { x: 51.2, y: 59.4 }, neighbors: ["sao-paulo","khartoum","kinshasa"] },
  { id: "kinshasa",         name: "Kinshasa",         color: "yellow", pos: { x: 55.6, y: 66.7 }, neighbors: ["lagos","khartoum","johannesburg"] },
  { id: "khartoum",         name: "Khartoum",         color: "yellow", pos: { x: 59.5, y: 57.6 }, neighbors: ["lagos","kinshasa","johannesburg","cairo"] },
  { id: "johannesburg",     name: "Johannesburg",     color: "yellow", pos: { x: 59.3, y: 77.1 }, neighbors: ["kinshasa","khartoum","buenos-aires"] },
  { id: "algiers",          name: "Algiers",          color: "black",  pos: { x: 52.7, y: 45.8 }, neighbors: ["madrid","paris","istanbul","cairo"] },
  { id: "cairo",            name: "Cairo",            color: "black",  pos: { x: 58.2, y: 47.3 }, neighbors: ["algiers","istanbul","baghdad","riyadh","khartoum"] },
  { id: "istanbul",         name: "Istanbul",         color: "black",  pos: { x: 59.1, y: 38.7 }, neighbors: ["milan","st-petersburg","moscow","baghdad","cairo","algiers"] },
  { id: "moscow",           name: "Moscow",           color: "black",  pos: { x: 64.1, y: 32.9 }, neighbors: ["st-petersburg","istanbul","tehran"] },
  { id: "baghdad",          name: "Baghdad",          color: "black",  pos: { x: 63.6, y: 44   }, neighbors: ["istanbul","cairo","riyadh","karachi","tehran"] },
  { id: "riyadh",           name: "Riyadh",           color: "black",  pos: { x: 64.4, y: 53.2 }, neighbors: ["cairo","baghdad","karachi"] },
  { id: "tehran",           name: "Tehran",           color: "black",  pos: { x: 68.5, y: 37.7 }, neighbors: ["moscow","baghdad","karachi","delhi"] },
  { id: "karachi",          name: "Karachi",          color: "black",  pos: { x: 69.7, y: 47.3 }, neighbors: ["riyadh","baghdad","tehran","delhi","mumbai"] },
  { id: "delhi",            name: "Delhi",            color: "black",  pos: { x: 74.5, y: 44.1 }, neighbors: ["tehran","karachi","mumbai","chennai","kolkata"] },
  { id: "mumbai",           name: "Mumbai",           color: "black",  pos: { x: 70.4, y: 54.7 }, neighbors: ["karachi","delhi","chennai"] },
  { id: "chennai",          name: "Chennai",          color: "black",  pos: { x: 75.3, y: 60   }, neighbors: ["mumbai","delhi","kolkata","jakarta"] },
  { id: "kolkata",          name: "Kolkata",          color: "black",  pos: { x: 79.1, y: 46.8 }, neighbors: ["delhi","chennai","bangkok","hong-kong"] },
  { id: "beijing",          name: "Beijing",          color: "red",    pos: { x: 83.1, y: 35.1 }, neighbors: ["shanghai","seoul"] },
  { id: "seoul",            name: "Seoul",            color: "red",    pos: { x: 88.7, y: 34.1 }, neighbors: ["beijing","shanghai","tokyo"] },
  { id: "tokyo",            name: "Tokyo",            color: "red",    pos: { x: 93.6, y: 38.3 }, neighbors: ["seoul","shanghai","osaka","san-francisco"] },
  { id: "osaka",            name: "Osaka",            color: "red",    pos: { x: 94.4, y: 46.4 }, neighbors: ["tokyo","taipei"] },
  { id: "shanghai",         name: "Shanghai",         color: "red",    pos: { x: 83.3, y: 42.3 }, neighbors: ["beijing","seoul","tokyo","taipei","hong-kong"] },
  { id: "taipei",           name: "Taipei",           color: "red",    pos: { x: 90.6, y: 46.8 }, neighbors: ["osaka","shanghai","hong-kong","manila"] },
  { id: "hong-kong",        name: "Hong Kong",        color: "red",    pos: { x: 83.9, y: 51.9 }, neighbors: ["shanghai","taipei","manila","ho-chi-minh-city","bangkok","kolkata"] },
  { id: "bangkok",          name: "Bangkok",          color: "red",    pos: { x: 80.2, y: 55.5 }, neighbors: ["kolkata","hong-kong","ho-chi-minh-city","jakarta"] },
  { id: "ho-chi-minh-city", name: "Ho Chi Minh City", color: "red",    pos: { x: 84.2, y: 62.5 }, neighbors: ["bangkok","hong-kong","manila","jakarta"] },
  { id: "manila",           name: "Manila",           color: "red",    pos: { x: 91,   y: 62.1 }, neighbors: ["san-francisco","taipei","hong-kong","ho-chi-minh-city","sydney"] },
  { id: "jakarta",          name: "Jakarta",          color: "red",    pos: { x: 80.2, y: 69.2 }, neighbors: ["chennai","bangkok","ho-chi-minh-city","sydney"] },
  { id: "sydney",           name: "Sydney",           color: "red",    pos: { x: 94.8, y: 83.4 }, neighbors: ["jakarta","manila","los-angeles"] },
];

const WRAP_ROUTES = [
  { a: "san-francisco", b: "tokyo",  left: { x: 9,   y: 38.4 }, right: { x: 99.6, y: 38.3 } },
  { a: "san-francisco", b: "manila", left: { x: 8.8, y: 41.4 }, right: { x: 99.6, y: 60   } },
  { a: "los-angeles",   b: "sydney", left: { x: 9,   y: 56.7 }, right: { x: 99.6, y: 80.8 } },
];
const WRAP_PAIRS = new Set(WRAP_ROUTES.map(w => [w.a, w.b].sort().join('|')));
const byId = Object.fromEntries(CITIES.map(c => [c.id, c]));

const OBJECTIVE_SLOTS = [
  { x: 7.02,  y: 8.62,  w: 11.09 },
  { x: 19.09, y: 8.51,  w: 11.09 },
  { x: 31.45, y: 8.27,  w: 11.09 },
  { x: 43.82, y: 8.39,  w: 11.09 },
  { x: 56.04, y: 8.62,  w: 11.09 },
];

const OUTBREAK_TRACK = [
  { x: 3.87, y: 41.84 }, { x: 6.70, y: 45.22 }, { x: 3.82, y: 48.35 },
  { x: 6.70, y: 51.66 }, { x: 3.88, y: 54.98 }, { x: 6.65, y: 58.02 },
  { x: 3.88, y: 60.89 }, { x: 6.65, y: 64.11 }, { x: 3.82, y: 67.16 },
];

const INFECTION_TRACK = [
  { x: 72.72, y: 20.62 }, { x: 76.07, y: 20.47 }, { x: 79.46, y: 20.34 },
  { x: 82.83, y: 20.33 }, { x: 86.20, y: 20.24 }, { x: 89.63, y: 20.07 },
  { x: 93.10, y: 20.07 },
];

const CARD_INFECTION        = { x: 75.98, y: 9.04,  w: 11.59 };
const CARD_PLAYER           = { x: 74.18, y: 89.26, w: 8.38  };
const CARD_INFECTION_DISC   = { x: 89.44, y: 8.55,  w: 11.59 };
const CARD_PLAYER_DISC      = { x: 84.73, y: 89.55, w: 8.38  };

// Cure markers: [red(no tint), yellow, blue, black]
const CURE_MARKERS = [
  { label: 'CR',  color: '#e0533d', start: { x: 8.97,  y: 96.60 }, cured: { x: 9.27,  y: 72.82 } },
  { label: 'CY',  color: '#f2c83d', start: { x: 3.21,  y: 96.42 }, cured: { x: 3.30,  y: 72.91 } },
  { label: 'CB',  color: '#3da5e0', start: { x: 14.77, y: 96.73 }, cured: { x: 14.82, y: 72.73 } },
  { label: 'CK',  color: '#9aaabb', start: { x: 20.55, y: 96.78 }, cured: { x: 20.52, y: 72.82 } },
];

// Outbreak marker start
const OUTBREAK_MARKER = { x: 3.87, y: 41.84, w: 2.20 };
// Infection rate marker start
const INFRATE_MARKER  = { x: 72.72, y: 20.62, w: 2.79 };

// Default player tokens
const TOKENS = [
  { label: 'P1', color: '#e8479a', x: 51.21, y: 57.25 },
  { label: 'P2', color: '#e8720a', x: 53.00, y: 57.25 },
  { label: 'P3', color: '#f0f0f0', x: 55.00, y: 57.25 },
  { label: 'P4', color: '#1a2a8a', x: 57.00, y: 57.25 },
];

// Cube supply tray centers
const CUBE_TRAYS = [
  { label: 'Black\ncubes', color: '#9aaabb', x: 20.52, y: 89.41 },
  { label: 'Yellow\ncubes', color: '#f2c83d', x: 3.21,  y: 89.41 },
  { label: 'Red\ncubes',   color: '#e0533d', x: 8.97,  y: 89.41 },
  { label: 'Blue\ncubes',  color: '#3da5e0', x: 14.77, y: 89.41 },
];

// HCMC tray
const HCMC_TRAY = { x: 85.88, y: 60.93 };

// ─── Draw ────────────────────────────────────────────────────────────────────

// 1. City connections
const drawn = new Set();
for (const c of CITIES) {
  for (const n of c.neighbors) {
    const key = [c.id, n].sort().join('|');
    if (drawn.has(key)) continue;
    drawn.add(key);
    if (WRAP_PAIRS.has(key)) continue;
    const nb = byId[n];
    if (!nb) continue;
    line(c.pos.x, c.pos.y, nb.pos.x, nb.pos.y, '#ffffff', '0.5', '0.25');
  }
}
for (const w of WRAP_ROUTES) {
  const a = byId[w.a], b = byId[w.b];
  if (a) line(a.pos.x, a.pos.y, w.left.x,  w.left.y,  '#ffffff', '0.35', '0.25', '0.8 0.5');
  if (b) line(b.pos.x, b.pos.y, w.right.x, w.right.y, '#ffffff', '0.35', '0.25', '0.8 0.5');
}

// 2. City dots
for (const c of CITIES) {
  circle(c.pos.x, c.pos.y, 0.9, COLOR_HEX[c.color], COLOR_HEX[c.color]);
}

// 3. Objective slots (landscape cards, pixel h/w ≈ 0.7)
for (let i = 0; i < OBJECTIVE_SLOTS.length; i++) {
  const s = OBJECTIVE_SLOTS[i];
  rect(s.x, s.y, s.w, 0.70, '#ffdd00', '#ffdd00', '0.8 0.4');
  text(s.x, s.y, `OBJ${i+1}`, '#ffee44', '2.2');
}

// 4. Outbreak track
for (let i = 0; i < OUTBREAK_TRACK.length; i++) {
  const p = OUTBREAK_TRACK[i];
  circle(p.x, p.y, 1.1, '#4488ff', '#4488ff', 0.9);
  text(p.x, p.y, String(i), '#cce0ff', '2.0');
}

// 5. Infection rate track
for (let i = 0; i < INFECTION_TRACK.length; i++) {
  const p = INFECTION_TRACK[i];
  circle(p.x, p.y, 1.1, '#44ff88', '#44ff88', 0.9);
  text(p.x, p.y, String(i), '#ccffdd', '2.0');
}

// 6. Card piles (portrait cards, pixel h/w ≈ 1.4)
const CARD_PILES = [
  { ...CARD_INFECTION,      label: 'INF\nDECK'  },
  { ...CARD_INFECTION_DISC, label: 'INF\nDISC'  },
  { ...CARD_PLAYER,         label: 'PLY\nDECK'  },
  { ...CARD_PLAYER_DISC,    label: 'PLY\nDISC'  },
];
for (const p of CARD_PILES) {
  rect(p.x, p.y, p.w, 1.4, '#cccccc', '#aaaaaa', null);
  text(p.x, p.y, p.label, '#ffffff', '2.0');
}

// 7. Cure markers — start (solid) and cured (dashed)
for (const m of CURE_MARKERS) {
  circle(m.start.x, m.start.y, 1.2, m.color, m.color, 1.0);
  text(m.start.x, m.start.y, m.label, '#fff', '1.8');
  // Cured position — dashed ring
  el('ellipse', {
    cx: m.cured.x, cy: m.cured.y, rx: 1.2, ry: 1.2 * AR,
    stroke: m.color, 'stroke-width': '0.5', fill: m.color, 'fill-opacity': '0.2',
    'stroke-opacity': '0.8', 'vector-effect': 'non-scaling-stroke',
    'stroke-dasharray': '1 0.6',
  });
  text(m.cured.x, m.cured.y, '✓', m.color, '2.0');
}

// 8. Player tokens defaults
for (const t of TOKENS) {
  circle(t.x, t.y, 1.1, t.color, t.color, 1.0);
  text(t.x, t.y, t.label, '#fff', '1.8');
}

// 9. Cube supply trays
for (const t of CUBE_TRAYS) {
  rect(t.x, t.y, 4.5, 1.2, t.color, t.color, '1 0.5', 0.8);
  text(t.x, t.y, t.label.split('\n')[0], t.color, '1.8');
}

// 10. Outbreak + infection-rate marker start positions (large icons)
circle(OUTBREAK_MARKER.x, OUTBREAK_MARKER.y, 1.5, '#ff4400', '#ff4400', 0.6);
text(OUTBREAK_MARKER.x, OUTBREAK_MARKER.y, 'OB', '#ffaa88', '2.0');
circle(INFRATE_MARKER.x, INFRATE_MARKER.y, 1.5, '#00ccff', '#00ccff', 0.6);
text(INFRATE_MARKER.x, INFRATE_MARKER.y, 'IR', '#88eeff', '2.0');

// 11. HCMC tray
circle(HCMC_TRAY.x, HCMC_TRAY.y, 1.2, '#ff66cc', '#ff66cc', 0.7);
text(HCMC_TRAY.x, HCMC_TRAY.y, 'HC', '#ffccee', '1.8');
</script>
</body>
</html>
